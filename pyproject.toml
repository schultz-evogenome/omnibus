[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibus-registry"
description = "The Omnibus registry of lab knowledge servers: manifest validation, registry.json, node checks, and a router over MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Darrin T. Schultz" }]
dynamic = ["version"]
dependencies = [
    "pyyaml",
    "pydantic>=2",
    "requests",
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/schultz-evogenome/omnibus"
Issues = "https://github.com/schultz-evogenome/omnibus/issues"

[project.scripts]
omnibus = "omnibus_registry.cli:main"

[tool.setuptools.dynamic]
version = { attr = "omnibus_registry.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
